			* { box-sizing: border-box; }
			html, body { min-height: 100%; }

				min-height: 100vh;

			}
			.page-shell {
				width: min(100% - 32px, 1060px);
				margin: 0 auto;
				padding: 24px 0 48px;
			}
			.banner {
				display: block;
				width: 100%;
				aspect-ratio: 1060 / 175;
				object-fit: cover;
				border-bottom: 3px solid #e5233e;
				border-radius: 8px 8px 0 0;
			}
			.identity {
				display: flex;
				align-items: center;
				gap: 20px;
				padding: 22px 0 26px;
			}
			.avatar {
				width: 116px;
				height: 116px;
				flex: 0 0 116px;
				border: 3px solid #e5233e;
				border-radius: 50%;
				object-fit: cover;
			}
			h1 {
				margin: 0;
				font-size: clamp(30px, 6vw, 54px);
				line-height: 1;
				text-transform: uppercase;
			}
			.handle {
				margin: 9px 0 0;
				color: #aeb0b7;
				font-size: 14px;
			}
			.button-grid {
				display: grid;
				gap: 12px;
				padding-top: 22px;
				border-top: 1px solid #ffffff24;
			}
			.social-links {
				grid-column: 1 / -1;
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 12px;
			}
			.social-link {
				min-height: 60px;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 12px;
				border: 1px solid #ffffff25;
				border-radius: 10px;
				background: #15161c;
				color: #fff;
				font-size: 18px;
				font-weight: 700;
				text-decoration: none;
				box-shadow: 0 10px 30px #0005;
				transition: transform 160ms ease, filter 160ms ease, border-color 160ms ease;
				cursor: pointer;
			}
			.social-link svg {
				width: 26px;
				height: 26px;
				flex: 0 0 26px;
			}
			.social-link:hover {
				transform: translateY(-2px);
				filter: brightness(1.08);
				border-color: #ffffff70;
			}
			.social-link:focus-visible {
				outline: 3px solid #fff;
				outline-offset: 3px;
			}
			.social-link[data-platform="TikTok"] {
				border-color: #25f4ee;
				background: #111a20;
			}
			.social-link[data-platform="Instagram"] {
				border-color: #d946a8;
				background: linear-gradient(115deg, #833ab4, #e1306c 58%, #f77737);
			}
			.social-link[data-platform="YouTube"] {
				border-color: #ff304f;
				background: #e5233e;
			}
			@media (max-width: 620px) {
				.page-shell { padding-top: 12px; }
				.identity { align-items: flex-start; gap: 14px; padding: 16px 0 22px; }
				.avatar { width: 76px; height: 76px; flex-basis: 76px; }
				h1 { font-size: clamp(26px, 8vw, 40px); }
				.social-links { grid-template-columns: 1fr; }
				.social-link { min-height: 54px; }
			}
			@media (prefers-reduced-motion: reduce) {
				.social-link { transition: none; }
			}
